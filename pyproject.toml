[project]
name = "nuteval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.2.0",
    "google-genai>=2.20.0",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"
