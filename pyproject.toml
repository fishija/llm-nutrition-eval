[project]
name = "nuteval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "nbformat>=5.11.1",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "pydantic>=2.13.5",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.2.0"]
gemini = ["google-genai>=2.20.0"]
all = [
    "nuteval[anthropic,gemini]",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"
